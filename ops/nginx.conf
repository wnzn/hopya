worker_processes auto;
pid /tmp/nginx.pid;
# Error-level request diagnostics can contain OIDC callback query secrets.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # No query strings, Authorization, cookies, request bodies, or referrers.
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 20m;
        client_body_timeout 30s;
        send_timeout 60s;
        keepalive_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Resolve again after a container is recreated rather than pinning its IP.
        set $api_upstream api:3333;
        set $web_upstream web:4321;

        location = /health {
            proxy_pass http://$api_upstream$request_uri;
        }
        location /api/ {
            proxy_pass http://$api_upstream$request_uri;
        }
        location / {
            proxy_pass http://$web_upstream$request_uri;
        }
    }
}
